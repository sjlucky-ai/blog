<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Design</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      background: #f8eff0;
      color: #111;
    }

    .wrapper {
      max-width: 1024px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #fde4e6;
    }

    .icon-btn {
      border: none;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      color: #111;
    }

    .logo-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #22b8aa;
      color: #fff;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 20px;
    }

    .right-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .middle {
      display: flex;
      justify-content: center;
      padding: 28px 0;
    }

    .card {
      width: min(320px, 90%);
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    .card img {
      width: 100%;
      display: block;
      height: auto;
    }

    .info {
      text-align: center;
      background: #a8f0e2;
      padding: 40px 20px 50px;
    }

    .info-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .logo-circle.small {
      width: 46px;
      height: 46px;
      font-size: 18px;
    }

    .info-title {
      font-size: 22px;
      font-weight: 600;
    }

    .info-text p {
      margin: 10px 0;
      font-size: 18px;
      line-height: 1.5;
    }

    .info-text a {
      color: #111;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 14px 16px;
      }

      .icon-btn {
        font-size: 24px;
      }

      .right-icons {
        gap: 12px;
      }

      .info {
        padding: 32px 16px 40px;
      }

      .info-title {
        font-size: 20px;
      }

      .info-text p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="topbar">
      <button class="icon-btn" aria-label="메뉴">☰</button>
      <div class="logo-circle">B</div>
      <div class="right-icons">
        <button class="icon-btn" aria-label="검색">🔍</button>
        <button class="icon-btn" aria-label="더보기">⋯</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <img
          src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1200&q=80"
          alt="거실 소파"
        />
      </section>

      <section class="middle">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=800&q=80"
            alt="노란 의자"
          />
        </div>
      </section>

      <section class="info">
        <div class="info-top">
          <div class="logo-circle small">B</div>
          <div class="info-title">test</div>
        </div>
        <div class="info-text">
          <p><a href="#">Address : Seoul Korea</a></p>
          <p><a href="mailto:Hanbit@hanbit.co.kr">E-Mail : Hanbit@hanbit.co.kr</a></p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
